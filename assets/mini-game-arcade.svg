<svg viewBox="0 0 900 480" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Screen Glass Gradient -->
    <radialGradient id="screenGlare" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D201A" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#141110" stop-opacity="1" />
      <stop offset="100%" stop-color="#0B0908" stop-opacity="1" />
    </radialGradient>

    <!-- Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E2824" />
      <stop offset="50%" stop-color="#1F1B18" />
      <stop offset="100%" stop-color="#151311" />
    </linearGradient>

    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="terracottaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-arcade { font-family: ui-monospace, "SF Mono", Monaco, "Courier New", monospace; }
    .font-serif { font-family: "Charter", "Iowan Old Style", "Georgia", serif; }

    /* Player Ship Oscillation */
    @keyframes shipPatrol {
      0%, 100% { transform: translate(430px, 320px); }
      30% { transform: translate(320px, 315px); }
      60% { transform: translate(560px, 325px); }
      80% { transform: translate(480px, 318px); }
    }

    /* Laser Blast Animations */
    @keyframes laserFired1 {
      0% { transform: translate(430px, 305px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(430px, 95px); opacity: 0; }
    }

    @keyframes laserFired2 {
      0% { transform: translate(335px, 300px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(335px, 95px); opacity: 0; }
    }

    @keyframes laserFired3 {
      0% { transform: translate(545px, 310px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(545px, 95px); opacity: 0; }
    }

    /* Bug / Error Drop */
    @keyframes enemyDrop1 {
      0% { transform: translate(335px, 80px); opacity: 1; }
      75% { transform: translate(335px, 175px) scale(1); opacity: 1; }
      80% { transform: translate(335px, 180px) scale(1.6); opacity: 0.9; }
      85%, 100% { transform: translate(335px, 180px) scale(0); opacity: 0; }
    }

    @keyframes enemyDrop2 {
      0% { transform: translate(430px, 75px); opacity: 1; }
      70% { transform: translate(430px, 185px) scale(1); opacity: 1; }
      75% { transform: translate(430px, 190px) scale(1.8); opacity: 1; }
      80%, 100% { transform: translate(430px, 190px) scale(0); opacity: 0; }
    }

    @keyframes enemyDrop3 {
      0% { transform: translate(545px, 85px); opacity: 1; }
      78% { transform: translate(545px, 180px) scale(1); opacity: 1; }
      82% { transform: translate(545px, 185px) scale(1.7); opacity: 0.95; }
      88%, 100% { transform: translate(545px, 185px) scale(0); opacity: 0; }
    }

    /* Token / Embedding Float */
    @keyframes tokenFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }

    /* CRT Flicker */
    @keyframes crtFlicker {
      0%, 100% { opacity: 0.97; }
      50% { opacity: 0.93; }
      85% { opacity: 0.99; }
    }

    /* Arcade Button Glow */
    @keyframes btnPulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px #D97757); }
      50% { opacity: 1; filter: drop-shadow(0 0 14px #E89275); }
    }

    .ship { animation: shipPatrol 7s ease-in-out infinite; }
    .laser1 { animation: laserFired1 2.3s infinite ease-in; }
    .laser2 { animation: laserFired2 2.7s infinite 0.9s ease-in; }
    .laser3 { animation: laserFired3 2.5s infinite 1.6s ease-in; }
    
    .enemy1 { animation: enemyDrop2 2.3s infinite ease-in; }
    .enemy2 { animation: enemyDrop1 2.7s infinite 0.9s ease-in; }
    .enemy3 { animation: enemyDrop3 2.5s infinite 1.6s ease-in; }

    .token-gem { animation: tokenFloat 4s ease-in-out infinite; transform-origin: center; }
    .crt-screen { animation: crtFlicker 0.15s infinite; }
    .btn-glow { animation: btnPulse 2.2s infinite ease-in-out; }
  </style>

  <!-- Outer Console Chassis -->
  <rect x="0" y="0" width="900" height="480" rx="24" fill="url(#bezelGrad)" stroke="#423932" stroke-width="2" />

  <!-- Chassis Screw Accents -->
  <circle cx="28" cy="28" r="4" fill="#362F29" stroke="#1F1B18" stroke-width="1.5" />
  <circle cx="872" cy="28" r="4" fill="#362F29" stroke="#1F1B18" stroke-width="1.5" />
  <circle cx="28" cy="452" r="4" fill="#362F29" stroke="#1F1B18" stroke-width="1.5" />
  <circle cx="872" cy="452" r="4" fill="#362F29" stroke="#1F1B18" stroke-width="1.5" />

  <!-- Console Brand Plate -->
  <g transform="translate(450, 26)">
    <rect x="-140" y="-12" width="280" height="24" rx="6" fill="#151210" stroke="#3D342C" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#D97757" class="font-arcade" font-size="11" font-weight="700" letter-spacing="2">
      CLAUDE-V1 // BACKEND ARCADE
    </text>
  </g>

  <!-- Arcade CRT Monitor Inner Frame -->
  <rect x="36" y="46" width="828" height="344" rx="16" fill="url(#screenGlare)" stroke="#382E27" stroke-width="2" class="crt-screen" />
  
  <!-- CRT Scanline Overlay -->
  <rect x="36" y="46" width="828" height="344" rx="16" fill="url(#scanlines)" pointer-events="none" />

  <!-- Starfield / Floating Data Packets Background -->
  <g opacity="0.35">
    <circle cx="90" cy="110" r="1.5" fill="#FAF6EE" />
    <circle cx="160" cy="240" r="1" fill="#D97757" />
    <circle cx="260" cy="90" r="2" fill="#E89275" />
    <circle cx="340" cy="280" r="1.5" fill="#FAF6EE" />
    <circle cx="480" cy="120" r="1" fill="#D97757" />
    <circle cx="620" cy="220" r="2" fill="#FAF6EE" />
    <circle cx="710" cy="100" r="1.5" fill="#E89275" />
    <circle cx="780" cy="290" r="1" fill="#FAF6EE" />
    <circle cx="810" cy="150" r="2" fill="#D97757" />
    <!-- Grid Perspective Lines -->
    <line x1="36" y1="360" x2="864" y2="360" stroke="#2B211B" stroke-width="1" />
    <line x1="120" y1="390" x2="280" y2="46" stroke="#241B16" stroke-width="0.8" />
    <line x1="780" y1="390" x2="620" y2="46" stroke="#241B16" stroke-width="0.8" />
  </g>

  <!-- HUD: Top Header Inside CRT Screen -->
  <g transform="translate(60, 78)">
    <!-- Lives Display -->
    <text x="0" y="0" fill="#D97757" class="font-arcade" font-size="12" font-weight="700">LIVES:</text>
    <path d="M 54 -9 L 58 -4 L 62 -9 A 3 3 0 0 1 67 -4 L 58 5 L 49 -4 A 3 3 0 0 1 54 -9 Z" fill="#E06D53" />
    <path d="M 74 -9 L 78 -4 L 82 -9 A 3 3 0 0 1 87 -4 L 78 5 L 69 -4 A 3 3 0 0 1 74 -9 Z" fill="#E06D53" />
    <path d="M 94 -9 L 98 -4 L 102 -9 A 3 3 0 0 1 107 -4 L 98 5 L 89 -4 A 3 3 0 0 1 94 -9 Z" fill="#E06D53" />

    <!-- Current Score -->
    <text x="360" y="0" text-anchor="middle" fill="#FAF6EE" class="font-arcade" font-size="13" font-weight="700">
      SCORE: <tspan fill="#E5A96A">048,290</tspan>
    </text>

    <!-- Health / RAG Cache Bar -->
    <g transform="translate(560, -10)">
      <text x="0" y="10" fill="#ABA49C" class="font-arcade" font-size="11">CACHE HIT:</text>
      <rect x="76" y="0" width="130" height="12" rx="3" fill="#1C1815" stroke="#3D332B" stroke-width="1" />
      <rect x="78" y="2" width="112" height="8" rx="2" fill="url(#terracottaGrad)" />
      <text x="216" y="10" fill="#D97757" class="font-arcade" font-size="10" font-weight="700">92%</text>
    </g>
  </g>

  <line x1="56" y1="94" x2="844" y2="94" stroke="#382C25" stroke-width="1" stroke-dasharray="4, 4" />

  <!-- Target Enemies / Bugs (Falling Down) -->
  <!-- Enemy 1: 500 Internal Error Bug -->
  <g class="enemy1">
    <g transform="translate(-16, -16)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#3D1A16" stroke="#D95757" stroke-width="1.5" />
      <text x="16" y="16" text-anchor="middle" fill="#FFA5A5" class="font-arcade" font-size="10" font-weight="700">500</text>
      <!-- Bug antennae -->
      <line x1="8" y1="0" x2="4" y2="-5" stroke="#D95757" stroke-width="1.5" />
      <line x1="24" y1="0" x2="28" y2="-5" stroke="#D95757" stroke-width="1.5" />
    </g>
  </g>

  <!-- Enemy 2: Memory Leak Bug -->
  <g class="enemy2">
    <g transform="translate(-20, -16)">
      <rect x="0" y="0" width="40" height="24" rx="4" fill="#3D2516" stroke="#E58E45" stroke-width="1.5" />
      <text x="20" y="16" text-anchor="middle" fill="#FFCBA5" class="font-arcade" font-size="9" font-weight="700">LEAK</text>
      <line x1="10" y1="0" x2="7" y2="-5" stroke="#E58E45" stroke-width="1.5" />
      <line x1="30" y1="0" x2="33" y2="-5" stroke="#E58E45" stroke-width="1.5" />
    </g>
  </g>

  <!-- Enemy 3: Timeout Error -->
  <g class="enemy3">
    <g transform="translate(-20, -16)">
      <rect x="0" y="0" width="40" height="24" rx="4" fill="#3D1922" stroke="#E05378" stroke-width="1.5" />
      <text x="20" y="16" text-anchor="middle" fill="#FFA5BE" class="font-arcade" font-size="9" font-weight="700">408</text>
      <line x1="10" y1="0" x2="7" y2="-5" stroke="#E05378" stroke-width="1.5" />
      <line x1="30" y1="0" x2="33" y2="-5" stroke="#E05378" stroke-width="1.5" />
    </g>
  </g>

  <!-- Bonus Floating Items: Vector Embeddings & Redis Crystals -->
  <g transform="translate(180, 160)" class="token-gem">
    <!-- Embedding Star -->
    <path d="M 0 -12 L 4 -4 L 12 0 L 4 4 L 0 12 L -4 4 L -12 0 L -4 -4 Z" fill="#D97757" filter="url(#starGlow)" />
    <text x="0" y="24" text-anchor="middle" fill="#E89275" class="font-arcade" font-size="9">+RAG</text>
  </g>

  <g transform="translate(710, 180)" class="token-gem">
    <!-- Redis Gem -->
    <polygon points="0,-10 10,-3 6,9 -6,9 -10,-3" fill="#E5533D" filter="url(#starGlow)" />
    <text x="0" y="24" text-anchor="middle" fill="#FFA594" class="font-arcade" font-size="9">+CACHE</text>
  </g>

  <!-- Animated Lasers Fired Upwards -->
  <g class="laser1">
    <rect x="-2" y="-12" width="4" height="22" rx="2" fill="#E89275" filter="url(#terracottaGlow)" />
  </g>
  <g class="laser2">
    <rect x="-2" y="-12" width="4" height="22" rx="2" fill="#FAF6EE" filter="url(#terracottaGlow)" />
  </g>
  <g class="laser3">
    <rect x="-2" y="-12" width="4" height="22" rx="2" fill="#E89275" filter="url(#terracottaGlow)" />
  </g>

  <!-- Animated Player Ship: AI Agent Core Shuttle -->
  <g class="ship">
    <!-- Engine Jet Glow -->
    <ellipse cx="0" cy="22" rx="7" ry="12" fill="#D97757" opacity="0.8" filter="url(#terracottaGlow)" />
    <ellipse cx="0" cy="24" rx="3" ry="7" fill="#FAF6EE" opacity="0.9" />

    <!-- Ship Chassis (Anthropic Style Clean Minimal Geometry) -->
    <polygon points="0,-22 18,12 10,18 0,14 -10,18 -18,12" fill="#29221C" stroke="#D97757" stroke-width="2" />
    
    <!-- Ship Cockpit / Core Sensor -->
    <circle cx="0" cy="-2" r="5" fill="#FAF6EE" filter="url(#terracottaGlow)" />
    
    <!-- Wing Cannons -->
    <rect x="-20" y="2" width="3" height="10" fill="#E89275" />
    <rect x="17" y="2" width="3" height="10" fill="#E89275" />

    <!-- Label -->
    <text x="0" y="38" text-anchor="middle" fill="#FAF6EE" class="font-arcade" font-size="10" font-weight="700">
      AGENT: MAYANK
    </text>
  </g>

  <!-- Bottom CRT Terminal Status Ticker -->
  <g transform="translate(60, 370)">
    <text x="0" y="0" fill="#756A5F" class="font-arcade" font-size="11">
      <tspan fill="#4ADE80">● AGENT_ONLINE</tspan> :: MISSION: INTERCEPT DISTRIBUTED BOTTLENECKS // COMBO: <tspan fill="#E5A96A">14x</tspan>
    </text>
    <text x="780" y="0" text-anchor="end" fill="#8C8074" class="font-arcade" font-size="11">
      WAVE 04/10
    </text>
  </g>

  <!-- Arcade Controller Deck (Lower Bezel) -->
  <g transform="translate(0, 398)">
    <!-- Controller Separator Line -->
    <line x1="36" y1="0" x2="864" y2="0" stroke="#3D342C" stroke-width="1.5" />

    <!-- Left Joystick -->
    <g transform="translate(100, 42)">
      <circle cx="0" cy="0" r="22" fill="#1C1815" stroke="#3D342C" stroke-width="2" />
      <line x1="0" y1="0" x2="-8" y2="-12" stroke="#2D2620" stroke-width="5" stroke-linecap="round" />
      <circle cx="-10" cy="-15" r="11" fill="#D97757" stroke="#FAF6EE" stroke-width="1" />
    </g>

    <!-- Center Call-to-Action Pill (Direct Link to Play Browser Version) -->
    <g transform="translate(450, 40)">
      <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#D97757" class="btn-glow" />
      <rect x="-188" y="-20" width="376" height="40" rx="20" fill="#C25E3E" />
      <text x="0" y="5" text-anchor="middle" fill="#FAF6EE" class="font-arcade" font-size="12" font-weight="700" letter-spacing="1">
        ▶ LAUNCH PLAYABLE GAME IN BROWSER
      </text>
    </g>

    <!-- Right Action Arcade Buttons -->
    <g transform="translate(790, 40)">
      <circle cx="-32" cy="6" r="14" fill="#2E241E" stroke="#D97757" stroke-width="2" />
      <text x="-32" y="10" text-anchor="middle" fill="#FAF6EE" class="font-arcade" font-size="10" font-weight="700">A</text>
      
      <circle cx="0" cy="-8" r="14" fill="#2E241E" stroke="#E5A96A" stroke-width="2" />
      <text x="0" y="-4" text-anchor="middle" fill="#FAF6EE" class="font-arcade" font-size="10" font-weight="700">B</text>

      <circle cx="32" cy="6" r="14" fill="#2E241E" stroke="#4ADE80" stroke-width="2" />
      <text x="32" y="10" text-anchor="middle" fill="#FAF6EE" class="font-arcade" font-size="10" font-weight="700">X</text>
    </g>
  </g>
</svg>
