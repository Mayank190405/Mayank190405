<svg viewBox="0 0 900 370" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181614" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231F1C" />
      <stop offset="100%" stop-color="#191614" />
    </linearGradient>

    <linearGradient id="terraProgress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#F2A585" />
    </linearGradient>
  </defs>

  <style>
    .font-serif { font-family: "Charter", "Iowan Old Style", "Georgia", serif; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    .matrix-card {
      transition: transform 0.2s ease;
    }
  </style>

  <rect x="0" y="0" width="900" height="370" rx="18" fill="url(#matrixBg)" stroke="#38312A" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(36, 32)">
    <text x="0" y="10" fill="#FAF6EE" class="font-serif" font-size="20" font-weight="600">
      Engineered Stack <tspan fill="#D97757" font-style="italic">&amp;</tspan> Technical Proficiencies
    </text>
    <text x="828" y="10" text-anchor="end" fill="#8C8176" class="font-mono" font-size="11">
      SPECIALIZATION INDEX // 2026
    </text>
  </g>

  <line x1="36" y1="58" x2="864" y2="58" stroke="#2B2520" stroke-width="1" />

  <!-- 4-Quadrant Grid of Competencies -->

  <!-- CARD 1: GenAI & AI Agents (Hero Corner) -->
  <g transform="translate(36, 76)" class="matrix-card">
    <rect x="0" y="0" width="404" height="126" rx="12" fill="url(#cardBg)" stroke="#573D31" stroke-width="1.5" />
    
    <g transform="translate(18, 22)">
      <circle cx="6" cy="6" r="4" fill="#D97757" />
      <text x="18" y="10" fill="#E89275" class="font-mono" font-size="11" font-weight="700">01 // GENAI &amp; AGENT ARCHITECTURE</text>
      
      <!-- Skill 1 -->
      <text x="0" y="38" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Autonomous AI Agents &amp; Tool Calling</text>
      <rect x="0" y="44" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="44" width="345" height="5" rx="2.5" fill="url(#terraProgress)" />

      <!-- Skill 2 -->
      <text x="0" y="68" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">RAG (Hybrid Retrieval &amp; pgvector)</text>
      <rect x="0" y="74" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="74" width="330" height="5" rx="2.5" fill="url(#terraProgress)" />
    </g>
  </g>

  <!-- CARD 2: Distributed Backend Systems -->
  <g transform="translate(460, 76)" class="matrix-card">
    <rect x="0" y="0" width="404" height="126" rx="12" fill="url(#cardBg)" stroke="#38312A" stroke-width="1.5" />
    
    <g transform="translate(18, 22)">
      <circle cx="6" cy="6" r="4" fill="#E5A96A" />
      <text x="18" y="10" fill="#E5A96A" class="font-mono" font-size="11" font-weight="700">02 // BACKEND CORE &amp; APIS</text>
      
      <!-- Skill 1 -->
      <text x="0" y="38" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Python (FastAPI, AsyncIO, PyDantic)</text>
      <rect x="0" y="44" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="44" width="350" height="5" rx="2.5" fill="#E5A96A" />

      <!-- Skill 2 -->
      <text x="0" y="68" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Node.js, Express &amp; TypeScript</text>
      <rect x="0" y="74" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="74" width="320" height="5" rx="2.5" fill="#E5A96A" />
    </g>
  </g>

  <!-- CARD 3: Databases & High-Speed Caching -->
  <g transform="translate(36, 218)" class="matrix-card">
    <rect x="0" y="0" width="404" height="126" rx="12" fill="url(#cardBg)" stroke="#38312A" stroke-width="1.5" />
    
    <g transform="translate(18, 22)">
      <circle cx="6" cy="6" r="4" fill="#88B04B" />
      <text x="18" y="10" fill="#A7C970" class="font-mono" font-size="11" font-weight="700">03 // DATA STORES &amp; STREAMING</text>
      
      <!-- Skill 1 -->
      <text x="0" y="38" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">PostgreSQL (Relational + pgvector)</text>
      <rect x="0" y="44" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="44" width="335" height="5" rx="2.5" fill="#88B04B" />

      <!-- Skill 2 -->
      <text x="0" y="68" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Redis (Caching, Pub/Sub, Rate Limits) &amp; MongoDB</text>
      <rect x="0" y="74" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="74" width="310" height="5" rx="2.5" fill="#88B04B" />
    </g>
  </g>

  <!-- CARD 4: DevOps, Architecture & Full-Stack CRM -->
  <g transform="translate(460, 218)" class="matrix-card">
    <rect x="0" y="0" width="404" height="126" rx="12" fill="url(#cardBg)" stroke="#38312A" stroke-width="1.5" />
    
    <g transform="translate(18, 22)">
      <circle cx="6" cy="6" r="4" fill="#60A5FA" />
      <text x="18" y="10" fill="#93C5FD" class="font-mono" font-size="11" font-weight="700">04 // SAAS, CRM &amp; INFRASTRUCTURE</text>
      
      <!-- Skill 1 -->
      <text x="0" y="38" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Docker Containers, Linux &amp; CI/CD</text>
      <rect x="0" y="44" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="44" width="320" height="5" rx="2.5" fill="#60A5FA" />

      <!-- Skill 2 -->
      <text x="0" y="68" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Enterprise CRM / HRMS Systems &amp; React</text>
      <rect x="0" y="74" width="368" height="5" rx="2.5" fill="#2E2822" />
      <rect x="0" y="74" width="340" height="5" rx="2.5" fill="#60A5FA" />
    </g>
  </g>
</svg>
