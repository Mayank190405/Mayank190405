<svg viewBox="0 0 900 420" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sortBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181614" />
      <stop offset="50%" stop-color="#13110F" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <!-- Bar Gradients -->
    <!-- Sorted Bar (Emerald Green) -->
    <linearGradient id="sortedBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1F4730" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Selected Minimum Bar (Terracotta Accent) -->
    <linearGradient id="selectedBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#73321E" />
      <stop offset="100%" stop-color="#D97757" />
    </linearGradient>

    <!-- Comparing Scan Bar (Warm Amber) -->
    <linearGradient id="comparingBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6E4A1E" />
      <stop offset="100%" stop-color="#E5A96A" />
    </linearGradient>

    <!-- Unsorted Bar (Neutral Stone) -->
    <linearGradient id="unsortedBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#231F1C" />
      <stop offset="100%" stop-color="#3D362F" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pointerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-serif { font-family: "Charter", "Iowan Old Style", "Georgia", serif; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    /* Animated Scanning Cursor */
    @keyframes scanAcross {
      0% { transform: translateX(0px); opacity: 0; }
      15% { transform: translateX(0px); opacity: 1; }
      30% { transform: translateX(96px); opacity: 1; }
      45% { transform: translateX(192px); opacity: 1; }
      60% { transform: translateX(288px); opacity: 1; }
      75% { transform: translateX(384px); opacity: 1; }
      85% { transform: translateX(480px); opacity: 1; }
      95%, 100% { transform: translateX(480px); opacity: 0; }
    }

    /* Swap Arc Pulse */
    @keyframes swapPulse {
      0%, 40% { stroke-dashoffset: 600; opacity: 0; }
      50% { opacity: 1; }
      85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { opacity: 0; }
    }

    /* Selected Min Pulse */
    @keyframes minIndicator {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .scanner { animation: scanAcross 6s ease-in-out infinite; }
    .swap-arc { stroke-dasharray: 600; animation: swapPulse 6s ease-in-out infinite; }
    .min-arrow { animation: minIndicator 1.8s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="420" rx="18" fill="url(#sortBg)" stroke="#38312A" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(36, 32)">
    <circle cx="6" cy="6" r="4" fill="#D97757" />
    <text x="22" y="10" fill="#FAF6EE" class="font-serif" font-size="20" font-weight="600">
      Selection Sort Visualizer <tspan fill="#D97757" font-style="italic">//</tspan> Array Execution Trace
    </text>
    <text x="828" y="10" text-anchor="end" fill="#8C8176" class="font-mono" font-size="11">
      ALGORITHM: SELECTION_SORT(A, N)
    </text>
  </g>

  <!-- Algorithm Complexity & Runtime Spec Bar -->
  <g transform="translate(36, 52)">
    <line x1="0" y1="8" x2="828" y2="8" stroke="#2B2520" stroke-width="1" />
    <text x="0" y="24" fill="#7A7065" class="font-mono" font-size="10.5">
      <tspan fill="#4ADE80">● IN-PLACE</tspan> | TIME: <tspan fill="#E5A96A">O(n²)</tspan> | AUX SPACE: <tspan fill="#4ADE80">O(1)</tspan> | STABLE: <tspan fill="#D97757">NO</tspan> | CURRENT PASS: <tspan fill="#FAF6EE">i = 2 (Selecting minimum in sub-array [2..7])</tspan>
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- MAIN VISUAL ARRAY BARS -->
  <!-- Array values: [11, 18, 62, 31, 84, 95, 47, 26] -->
  <!-- Indices 0,1 are sorted (Green). Index 2 (62) is current i. -->
  <!-- Index 7 (26) is identified as the minimum in unsorted segment! -->
  <!-- ============================================================ -->
  <g transform="translate(68, 110)">

    <!-- Bar Baseline Axis -->
    <line x1="0" y1="180" x2="764" y2="180" stroke="#38312A" stroke-width="1.5" />

    <!-- ELEMENT 0: Value = 11 (SORTED - Green) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="156" width="68" height="24" rx="5" fill="url(#sortedBar)" stroke="#4ADE80" stroke-width="1.2" />
      <text x="34" y="148" text-anchor="middle" fill="#4ADE80" class="font-mono" font-size="13" font-weight="700">11</text>
      <text x="34" y="200" text-anchor="middle" fill="#6E655B" class="font-mono" font-size="11">[0]</text>
      <text x="34" y="215" text-anchor="middle" fill="#4ADE80" class="font-mono" font-size="9">SORTED</text>
    </g>

    <!-- ELEMENT 1: Value = 18 (SORTED - Green) -->
    <g transform="translate(96, 0)">
      <rect x="0" y="142" width="68" height="38" rx="5" fill="url(#sortedBar)" stroke="#4ADE80" stroke-width="1.2" />
      <text x="34" y="134" text-anchor="middle" fill="#4ADE80" class="font-mono" font-size="13" font-weight="700">18</text>
      <text x="34" y="200" text-anchor="middle" fill="#6E655B" class="font-mono" font-size="11">[1]</text>
      <text x="34" y="215" text-anchor="middle" fill="#4ADE80" class="font-mono" font-size="9">SORTED</text>
    </g>

    <!-- Partition Divider Line: separates sorted prefix from unsorted suffix -->
    <line x1="180" y1="20" x2="180" y2="180" stroke="#D97757" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="170" y="6" width="20" height="14" rx="3" fill="#241E1A" stroke="#523528" stroke-width="1" />
    <text x="180" y="16" text-anchor="middle" fill="#D97757" class="font-mono" font-size="8">i</text>

    <!-- ELEMENT 2: Value = 62 (CURRENT POSITION 'i' - Preparing for swap) -->
    <g transform="translate(192, 0)">
      <rect x="0" y="46" width="68" height="134" rx="5" fill="url(#comparingBar)" stroke="#E5A96A" stroke-width="1.5" />
      <text x="34" y="38" text-anchor="middle" fill="#E5A96A" class="font-mono" font-size="13" font-weight="700">62</text>
      <text x="34" y="200" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="11">[2]</text>
      <rect x="6" y="206" width="56" height="15" rx="3" fill="#2E2319" stroke="#E5A96A" stroke-width="0.8" />
      <text x="34" y="217" text-anchor="middle" fill="#E5A96A" class="font-mono" font-size="8.5" font-weight="700">CURR (i)</text>
    </g>

    <!-- ELEMENT 3: Value = 31 (UNSORTED) -->
    <g transform="translate(288, 0)">
      <rect x="0" y="114" width="68" height="66" rx="5" fill="url(#unsortedBar)" stroke="#4A3F35" stroke-width="1" />
      <text x="34" y="106" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="13" font-weight="600">31</text>
      <text x="34" y="200" text-anchor="middle" fill="#6E655B" class="font-mono" font-size="11">[3]</text>
    </g>

    <!-- ELEMENT 4: Value = 84 (UNSORTED) -->
    <g transform="translate(384, 0)">
      <rect x="0" y="0" width="68" height="180" rx="5" fill="url(#unsortedBar)" stroke="#4A3F35" stroke-width="1" />
      <text x="34" y="-8" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="13" font-weight="600">84</text>
      <text x="34" y="200" text-anchor="middle" fill="#6E655B" class="font-mono" font-size="11">[4]</text>
    </g>

    <!-- ELEMENT 5: Value = 95 (UNSORTED) -->
    <g transform="translate(480, 0)">
      <rect x="0" y="-20" width="68" height="200" rx="5" fill="url(#unsortedBar)" stroke="#4A3F35" stroke-width="1" />
      <text x="34" y="-28" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="13" font-weight="600">95</text>
      <text x="34" y="200" text-anchor="middle" fill="#6E655B" class="font-mono" font-size="11">[5]</text>
    </g>

    <!-- ELEMENT 6: Value = 47 (UNSORTED) -->
    <g transform="translate(576, 0)">
      <rect x="0" y="80" width="68" height="100" rx="5" fill="url(#unsortedBar)" stroke="#4A3F35" stroke-width="1" />
      <text x="34" y="72" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="13" font-weight="600">47</text>
      <text x="34" y="200" text-anchor="middle" fill="#6E655B" class="font-mono" font-size="11">[6]</text>
    </g>

    <!-- ELEMENT 7: Value = 26 (FOUND MINIMUM! - Terracotta Accent) -->
    <g transform="translate(672, 0)">
      <rect x="0" y="124" width="68" height="56" rx="5" fill="url(#selectedBar)" stroke="#D97757" stroke-width="1.8" />
      <text x="34" y="116" text-anchor="middle" fill="#D97757" class="font-mono" font-size="13" font-weight="700">26</text>
      <text x="34" y="200" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="11">[7]</text>
      
      <!-- Selected Min Tag & Arrow -->
      <g class="min-arrow">
        <polygon points="34,228 29,236 39,236" fill="#D97757" />
        <rect x="2" y="238" width="64" height="16" rx="3" fill="#2E1812" stroke="#D97757" stroke-width="0.8" />
        <text x="34" y="250" text-anchor="middle" fill="#E89275" class="font-mono" font-size="8.5" font-weight="700">MIN_VAL</text>
      </g>
    </g>

    <!-- Dynamic Scanning Pointer Animation (Moving along unsorted sub-array [2..7]) -->
    <g class="scanner" transform="translate(192, 0)">
      <circle cx="34" cy="180" r="5" fill="#E5A96A" filter="url(#pointerGlow)" />
      <line x1="34" y1="185" x2="34" y2="195" stroke="#E5A96A" stroke-width="2" />
    </g>

    <!-- Curved Swap Trajectory Arc: Swaps [2] (62) with [7] (26) -->
    <path d="M 226 25 Q 466 -65 706 100" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6,4" class="swap-arc" />
    <text x="466" y="-35" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="11" font-weight="600" opacity="0.9">
      SWAP(A[2]=62, A[7]=26)
    </text>
  </g>

  <!-- Step Breakdown Ticker Card -->
  <g transform="translate(36, 350)">
    <rect x="0" y="0" width="828" height="48" rx="10" fill="#1C1916" stroke="#3A322A" stroke-width="1.2" />
    
    <circle cx="20" cy="24" r="4" fill="#D97757" />
    <text x="34" y="28" fill="#FAF6EE" class="font-mono" font-size="11.5">
      <tspan fill="#D97757" font-weight="700">STEP EXPLANATION:</tspan> Scanned indices [2..7]. Found minimum value <tspan fill="#E89275" font-weight="700">26</tspan> at index 7. Swapping with index 2 (<tspan fill="#E5A96A">62</tspan>).
    </text>

    <!-- Action Badge -->
    <g transform="translate(630, 10)">
      <rect x="0" y="0" width="186" height="28" rx="6" fill="#2E1B15" stroke="#D97757" stroke-width="1" />
      <text x="93" y="18" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="10" font-weight="700">
        ▶ OPEN WEB VISUALIZER ↗
      </text>
    </g>
  </g>
</svg>
