<svg viewBox="0 0 920 540" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Blueprint Gradient -->
    <linearGradient id="blueprintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171513" />
      <stop offset="60%" stop-color="#13110F" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <!-- Zone Card Fill -->
    <linearGradient id="zoneFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#151311" stop-opacity="0.95" />
    </linearGradient>

    <!-- Module Box Fill -->
    <linearGradient id="moduleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282420" />
      <stop offset="100%" stop-color="#1C1916" />
    </linearGradient>

    <!-- Hero Module Fill (Reasoning Core) -->
    <linearGradient id="heroModuleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#36221A" />
      <stop offset="100%" stop-color="#221510" />
    </linearGradient>

    <!-- Subtle Blueprint Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#25211D" stroke-width="0.5" stroke-opacity="0.6" />
      <line x1="0" y1="0" x2="0" y2="20" stroke="#25211D" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="busGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-serif { font-family: "Charter", "Iowan Old Style", "Georgia", "Cambria", serif; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    /* Animated Signal Pulses */
    @keyframes edgeToCore {
      0% { cx: 200; cy: 220; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 310; cy: 220; opacity: 0; }
    }

    @keyframes coreToAi {
      0% { cx: 480; cy: 190; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 580; cy: 190; opacity: 0; }
    }

    @keyframes coreToCache {
      0% { cx: 480; cy: 280; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 730; cy: 280; opacity: 0; }
    }

    @keyframes aiToVector {
      0% { cx: 660; cy: 300; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 730; cy: 380; opacity: 0; }
    }

    .pulse-edge { animation: edgeToCore 2s linear infinite; }
    .pulse-ai { animation: coreToAi 2s linear infinite 0.5s; }
    .pulse-cache { animation: coreToCache 1.8s linear infinite 0.8s; }
    .pulse-vector { animation: aiToVector 2.2s linear infinite 1.2s; }
  </style>

  <!-- Base Blueprint Background -->
  <rect x="0" y="0" width="920" height="540" rx="20" fill="url(#blueprintBg)" stroke="#38312A" stroke-width="1.5" />
  
  <!-- Subtle Blueprint Grid -->
  <rect x="0" y="0" width="920" height="540" rx="20" fill="url(#grid)" />

  <!-- Blueprint Header / Specification Block -->
  <g transform="translate(36, 32)">
    <circle cx="6" cy="6" r="4" fill="#D97757" />
    <text x="22" y="10" fill="#FAF6EE" class="font-serif" font-size="20" font-weight="600" letter-spacing="-0.3">
      System Architecture <tspan fill="#D97757" font-style="italic">&amp;</tspan> Topology Specification
    </text>
    <text x="848" y="10" text-anchor="end" fill="#8C8176" class="font-mono" font-size="11">
      ENGINEERING SPEC // REV-04.2
    </text>
  </g>

  <!-- Technical SLA Header Ticker -->
  <g transform="translate(36, 52)">
    <line x1="0" y1="8" x2="848" y2="8" stroke="#2B2520" stroke-width="1" />
    <text x="0" y="24" fill="#7A7065" class="font-mono" font-size="10.5">
      <tspan fill="#4ADE80">● FAULT-ISOLATED</tspan> | LATENCY BUDGET: <tspan fill="#E5A96A">P99 &lt; 35ms</tspan> | RECOVERY: <tspan fill="#D97757">CIRCUIT-BREAKER AUTO-TRIP</tspan> | PROTOCOL: <tspan fill="#FAF6EE">HTTP/2 + WSS</tspan>
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- ZONE 01: EDGE & INGESTION TIER -->
  <!-- ============================================================ -->
  <g transform="translate(36, 95)">
    <!-- Zone Bounding Box -->
    <rect x="0" y="0" width="170" height="375" rx="14" fill="url(#zoneFill)" stroke="#3E342B" stroke-dasharray="6,4" stroke-width="1.2" />
    <rect x="14" y="-10" width="130" height="20" rx="4" fill="#241E1A" stroke="#523528" stroke-width="1" />
    <text x="79" y="4" text-anchor="middle" fill="#E89275" class="font-mono" font-size="9" font-weight="700">ZONE 01: EDGE INGRESS</text>

    <!-- Client Traffic Source -->
    <g transform="translate(14, 28)">
      <rect x="0" y="0" width="142" height="70" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="22" fill="#FAF6EE" class="font-serif" font-size="13" font-weight="600">Client Interfaces</text>
      <text x="12" y="40" fill="#9C9286" class="font-sans" font-size="10.5">React • Next.js • Webhooks</text>
      <text x="12" y="56" fill="#6E655B" class="font-mono" font-size="9">HTTPS / WSS / gRPC-Web</text>
    </g>

    <!-- Edge Security & Reverse Proxy -->
    <g transform="translate(14, 114)">
      <rect x="0" y="0" width="142" height="82" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13" font-weight="600">Reverse Proxy</text>
      <text x="12" y="38" fill="#D97757" class="font-mono" font-size="10">TLS 1.3 Termination</text>
      <text x="12" y="54" fill="#9C9286" class="font-sans" font-size="10">Token Bucket Limiter</text>
      <text x="12" y="70" fill="#6E655B" class="font-mono" font-size="9">Rate: 10,000 req/min</text>
    </g>

    <!-- Session Guard & Auth -->
    <g transform="translate(14, 212)">
      <rect x="0" y="0" width="142" height="74" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13" font-weight="600">Security Gate</text>
      <text x="12" y="38" fill="#9C9286" class="font-sans" font-size="10.5">JWT &amp; OAuth2 RBAC</text>
      <text x="12" y="54" fill="#9C9286" class="font-sans" font-size="10">CORS &amp; Payload Sanitizer</text>
      <rect x="12" y="62" width="60" height="4" rx="2" fill="#4ADE80" />
    </g>

    <!-- Zone Status Indicator -->
    <text x="14" y="355" fill="#6E655B" class="font-mono" font-size="9.5">INGRESS BUDGET: &lt; 6ms</text>
  </g>

  <!-- ============================================================ -->
  <!-- ZONE 02: ASYNC APPLICATION CORE -->
  <!-- ============================================================ -->
  <g transform="translate(230, 95)">
    <!-- Zone Bounding Box -->
    <rect x="0" y="0" width="200" height="375" rx="14" fill="url(#zoneFill)" stroke="#4A3B31" stroke-dasharray="6,4" stroke-width="1.2" />
    <rect x="20" y="-10" width="160" height="20" rx="4" fill="#241E1A" stroke="#523528" stroke-width="1" />
    <text x="100" y="4" text-anchor="middle" fill="#E5A96A" class="font-mono" font-size="9" font-weight="700">ZONE 02: COMPUTE &amp; WORKERS</text>

    <!-- FastAPI Primary Service -->
    <g transform="translate(16, 28)">
      <rect x="0" y="0" width="168" height="88" rx="8" fill="url(#moduleFill)" stroke="#5E4334" stroke-width="1.2" />
      <circle cx="14" cy="18" r="3.5" fill="#4ADE80" />
      <text x="24" y="22" fill="#FAF6EE" class="font-serif" font-size="14" font-weight="600">FastAPI Gateway</text>
      <text x="12" y="42" fill="#D97757" class="font-mono" font-size="10.5">AsyncIO Event Loop</text>
      <text x="12" y="58" fill="#9C9286" class="font-sans" font-size="10">Pydantic v2 Schema Guard</text>
      <text x="12" y="74" fill="#6E655B" class="font-mono" font-size="9">Stateless Microservices</text>
    </g>

    <!-- Node.js CRM Microservice -->
    <g transform="translate(16, 130)">
      <rect x="0" y="0" width="168" height="84" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13.5" font-weight="600">Express / TypeScript</text>
      <text x="12" y="38" fill="#E5A96A" class="font-mono" font-size="10">CRM Workflow Pipeline</text>
      <text x="12" y="54" fill="#9C9286" class="font-sans" font-size="10">Real-Time Event Dispatch</text>
      <text x="12" y="70" fill="#6E655B" class="font-mono" font-size="9">Role-Based Lead State</text>
    </g>

    <!-- Background Task Worker Pool -->
    <g transform="translate(16, 228)">
      <rect x="0" y="0" width="168" height="84" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13" font-weight="600">Async Task Workers</text>
      <text x="12" y="38" fill="#9C9286" class="font-sans" font-size="10.5">Celery / Redis Streams</text>
      <text x="12" y="54" fill="#D97757" class="font-mono" font-size="9.5">Dead Letter Queue (DLQ)</text>
      <text x="12" y="70" fill="#6E655B" class="font-mono" font-size="9">Decoupled Heavy Jobs</text>
    </g>

    <text x="16" y="355" fill="#6E655B" class="font-mono" font-size="9.5">COMPUTE LATENCY: &lt; 18ms</text>
  </g>

  <!-- ============================================================ -->
  <!-- ZONE 03: REASONING & HYBRID RETRIEVAL (GenAI) -->
  <!-- ============================================================ -->
  <g transform="translate(456, 95)">
    <!-- Zone Bounding Box -->
    <rect x="0" y="0" width="220" height="375" rx="14" fill="url(#zoneFill)" stroke="#D97757" stroke-dasharray="6,4" stroke-width="1.4" />
    <rect x="20" y="-10" width="180" height="20" rx="4" fill="#2E1B15" stroke="#D97757" stroke-width="1" />
    <text x="110" y="4" text-anchor="middle" fill="#FAF6EE" class="font-mono" font-size="9" font-weight="700">ZONE 03: INTELLIGENCE &amp; RAG</text>

    <!-- Agentic Orchestrator (Hero Node) -->
    <g transform="translate(16, 28)">
      <rect x="0" y="0" width="188" height="116" rx="10" fill="url(#heroModuleFill)" stroke="#D97757" stroke-width="1.8" />
      <circle cx="16" cy="18" r="4" fill="#D97757" />
      <text x="26" y="22" fill="#FAF6EE" class="font-serif" font-size="15" font-weight="600">Multi-Agent Engine</text>
      
      <text x="14" y="44" fill="#FAF6EE" class="font-sans" font-size="11" font-weight="500">Autonomous Intent Router</text>
      <text x="14" y="60" fill="#D97757" class="font-mono" font-size="9.5">Dynamic Tool Calling</text>
      <text x="14" y="76" fill="#ABA297" class="font-sans" font-size="10">Context Window Compressor</text>
      <text x="14" y="94" fill="#E89275" class="font-mono" font-size="9">Guardrails &amp; Hallucination Check</text>
    </g>

    <!-- Hybrid RAG Pipeline Module -->
    <g transform="translate(16, 160)">
      <rect x="0" y="0" width="188" height="152" rx="10" fill="url(#moduleFill)" stroke="#52392E" stroke-width="1.2" />
      <text x="14" y="22" fill="#FAF6EE" class="font-serif" font-size="13.5" font-weight="600">Hybrid Search Engine</text>
      
      <!-- Split Strategy -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="76" height="42" rx="4" fill="#201C18" stroke="#3D332B" stroke-width="1" />
        <text x="8" y="16" fill="#D97757" class="font-mono" font-size="9" font-weight="700">DENSE</text>
        <text x="8" y="32" fill="#9C9286" class="font-sans" font-size="9">Cosine 1536d</text>

        <rect x="86" y="0" width="76" height="42" rx="4" fill="#201C18" stroke="#3D332B" stroke-width="1" />
        <text x="94" y="16" fill="#E5A96A" class="font-mono" font-size="9" font-weight="700">SPARSE</text>
        <text x="94" y="32" fill="#9C9286" class="font-sans" font-size="9">BM25 Rank</text>
      </g>

      <text x="14" y="98" fill="#FAF6EE" class="font-sans" font-size="10.5" font-weight="500">Reciprocal Rank Fusion (RRF)</text>
      <text x="14" y="114" fill="#9C9286" class="font-sans" font-size="10">Cross-Encoder Re-ranker</text>
      <text x="14" y="132" fill="#6E655B" class="font-mono" font-size="9">Target Precision: 98.4%</text>
    </g>

    <text x="16" y="355" fill="#D97757" class="font-mono" font-size="9.5">FALLBACK: EXPONENTIAL BACKOFF</text>
  </g>

  <!-- ============================================================ -->
  <!-- ZONE 04: PERSISTENCE & STORAGE TIERS -->
  <!-- ============================================================ -->
  <g transform="translate(702, 95)">
    <!-- Zone Bounding Box -->
    <rect x="0" y="0" width="182" height="375" rx="14" fill="url(#zoneFill)" stroke="#3E342B" stroke-dasharray="6,4" stroke-width="1.2" />
    <rect x="16" y="-10" width="150" height="20" rx="4" fill="#241E1A" stroke="#523528" stroke-width="1" />
    <text x="91" y="4" text-anchor="middle" fill="#88B04B" class="font-mono" font-size="9" font-weight="700">ZONE 04: DATA &amp; STATE</text>

    <!-- Redis In-Memory Layer -->
    <g transform="translate(14, 28)">
      <rect x="0" y="0" width="154" height="84" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13.5" font-weight="600">Redis Cache-Aside</text>
      <text x="12" y="38" fill="#E5A96A" class="font-mono" font-size="10">Latency: &lt; 1.8ms</text>
      <text x="12" y="54" fill="#9C9286" class="font-sans" font-size="10">Pub/Sub + Distributed Lock</text>
      <text x="12" y="70" fill="#6E655B" class="font-mono" font-size="9">TTL-Driven Invalidation</text>
    </g>

    <!-- PostgreSQL Relational & pgvector -->
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="154" height="92" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13.5" font-weight="600">PostgreSQL Cluster</text>
      <text x="12" y="38" fill="#D97757" class="font-mono" font-size="10">pgvector Indexing</text>
      <text x="12" y="54" fill="#9C9286" class="font-sans" font-size="10">ACID Relational Storage</text>
      <text x="12" y="70" fill="#6E655B" class="font-mono" font-size="9">Read Replica / WAL Sync</text>
      <rect x="12" y="78" width="80" height="4" rx="2" fill="#D97757" />
    </g>

    <!-- MongoDB Document Engine -->
    <g transform="translate(14, 232)">
      <rect x="0" y="0" width="154" height="80" rx="8" fill="url(#moduleFill)" stroke="#38312A" stroke-width="1" />
      <text x="12" y="20" fill="#FAF6EE" class="font-serif" font-size="13.5" font-weight="600">MongoDB</text>
      <text x="12" y="38" fill="#88B04B" class="font-mono" font-size="10">Dynamic CRM Entities</text>
      <text x="12" y="54" fill="#9C9286" class="font-sans" font-size="10">Aggregated Audit Trails</text>
      <text x="12" y="68" fill="#6E655B" class="font-mono" font-size="9">High-Write Ingestion</text>
    </g>

    <text x="14" y="355" fill="#6E655B" class="font-mono" font-size="9.5">DURABILITY: ZERO DATA LOSS</text>
  </g>

  <!-- ============================================================ -->
  <!-- CONNECTING BUSES & INTER-ZONE FLOWS -->
  <!-- ============================================================ -->
  <!-- Flow 1: Zone 1 to Zone 2 -->
  <line x1="206" y1="210" x2="230" y2="210" stroke="#4A3B31" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="218" cy="210" r="3" fill="#D97757" filter="url(#busGlow)" class="pulse-edge" />

  <!-- Flow 2: Zone 2 to Zone 3 -->
  <line x1="430" y1="180" x2="456" y2="180" stroke="#4A3B31" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="443" cy="180" r="3" fill="#E5A96A" filter="url(#busGlow)" class="pulse-ai" />

  <!-- Flow 3: Zone 2 to Zone 4 (Direct Cache Bus) -->
  <path d="M 430 260 L 444 260 L 444 485 L 680 485 L 680 160 L 702 160" fill="none" stroke="#3D322A" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="560" cy="485" r="3" fill="#E5A96A" filter="url(#busGlow)" class="pulse-cache" />

  <!-- Flow 4: Zone 3 to Zone 4 (Vector Bus) -->
  <line x1="676" y1="240" x2="702" y2="240" stroke="#D97757" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="689" cy="240" r="3" fill="#D97757" filter="url(#busGlow)" class="pulse-vector" />

  <!-- ============================================================ -->
  <!-- BOTTOM ARCHITECTURAL DECISIONS CALLOUT FOOTER -->
  <!-- ============================================================ -->
  <g transform="translate(36, 492)">
    <line x1="0" y1="0" x2="848" y2="0" stroke="#2B2520" stroke-width="1" />
    <text x="0" y="24" fill="#8C8176" class="font-mono" font-size="11">
      <tspan fill="#D97757" font-weight="700">KEY ARCHITECTURAL TRADE-OFFS:</tspan> 
      (1) Decoupled Queue isolates heavy LLM generation from API Gateway 
      (2) Hybrid RRF Reranker achieves 98%+ semantic accuracy over naive vector lookup 
      (3) Cache-Aside mitigates 80% DB load
    </text>
  </g>
</svg>
