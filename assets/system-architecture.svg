<svg viewBox="0 0 900 360" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181614" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#100E0D" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24201C" />
      <stop offset="100%" stop-color="#1A1715" />
    </linearGradient>

    <!-- Highlight Node Gradient (GenAI Core) -->
    <linearGradient id="highlightNodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E1F1A" />
      <stop offset="100%" stop-color="#1F1512" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-serif { font-family: "Charter", "Iowan Old Style", "Georgia", serif; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    /* Animated Pulses along the pipeline */
    @keyframes pulseData1 {
      0% { cx: 165; cy: 180; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 290; cy: 180; opacity: 0; }
    }

    @keyframes pulseData2 {
      0% { cx: 430; cy: 180; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 550; cy: 180; opacity: 0; }
    }

    @keyframes pulseData3 {
      0% { cx: 690; cy: 140; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 775; cy: 140; opacity: 0; }
    }

    @keyframes pulseData4 {
      0% { cx: 690; cy: 220; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 775; cy: 220; opacity: 0; }
    }

    .pulse-dot1 { animation: pulseData1 2s linear infinite; }
    .pulse-dot2 { animation: pulseData2 2s linear infinite 0.6s; }
    .pulse-dot3 { animation: pulseData3 2s linear infinite 1.2s; }
    .pulse-dot4 { animation: pulseData4 2s linear infinite 1.4s; }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="360" rx="18" fill="url(#archBg)" stroke="#38312A" stroke-width="1.5" />

  <!-- Blueprint Title Header -->
  <g transform="translate(36, 32)">
    <circle cx="6" cy="6" r="4" fill="#D97757" />
    <text x="22" y="10" fill="#FAF6EE" class="font-serif" font-size="20" font-weight="600">
      Production Blueprint <tspan fill="#D97757" font-style="italic">//</tspan> Architecture Overview
    </text>
    <text x="828" y="10" text-anchor="end" fill="#8C8176" class="font-mono" font-size="11">
      PROTOCOL: DISTRIBUTED-RAG-V2
    </text>
  </g>

  <line x1="36" y1="58" x2="864" y2="58" stroke="#2B2520" stroke-width="1" />

  <!-- CONNECTING BUS LINES -->
  <!-- Line 1: Inbound -> API Gateway -->
  <line x1="165" y1="180" x2="290" y2="180" stroke="#3D352D" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Line 2: API Gateway -> GenAI Orchestrator -->
  <line x1="430" y1="180" x2="550" y2="180" stroke="#3D352D" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Line 3: GenAI Orchestrator -> Vector & Redis -->
  <path d="M 690 180 L 730 180 L 730 140 L 775 140" fill="none" stroke="#3D352D" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 690 180 L 730 180 L 730 220 L 775 220" fill="none" stroke="#3D352D" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Animated Data Packet Pulses -->
  <circle cx="165" cy="180" r="4" fill="#D97757" filter="url(#softGlow)" class="pulse-dot1" />
  <circle cx="430" cy="180" r="4" fill="#E5A96A" filter="url(#softGlow)" class="pulse-dot2" />
  <circle cx="690" cy="140" r="4" fill="#4ADE80" filter="url(#softGlow)" class="pulse-dot3" />
  <circle cx="690" cy="220" r="4" fill="#D97757" filter="url(#softGlow)" class="pulse-dot4" />

  <!-- NODE 1: Client & Client Workflows -->
  <g transform="translate(36, 120)">
    <rect x="0" y="0" width="130" height="120" rx="12" fill="url(#nodeBg)" stroke="#3A332B" stroke-width="1.5" />
    <circle cx="20" cy="22" r="4" fill="#8C8176" />
    <text x="32" y="26" fill="#8C8176" class="font-mono" font-size="10">INBOUND</text>
    
    <text x="16" y="56" fill="#FAF6EE" class="font-serif" font-size="15" font-weight="600">Client Apps</text>
    <text x="16" y="74" fill="#ABA297" class="font-sans" font-size="11.5">React • Next.js</text>
    <text x="16" y="90" fill="#756D64" class="font-mono" font-size="10">HTTPS / WSS</text>
    <rect x="16" y="100" width="60" height="8" rx="4" fill="#24211D" />
    <rect x="16" y="100" width="45" height="8" rx="4" fill="#D97757" />
  </g>

  <!-- NODE 2: Gateway & Microservices -->
  <g transform="translate(290, 110)">
    <rect x="0" y="0" width="140" height="140" rx="12" fill="url(#nodeBg)" stroke="#4A3B31" stroke-width="1.5" />
    <rect x="14" y="14" width="8" height="8" rx="2" fill="#D97757" />
    <text x="28" y="22" fill="#D97757" class="font-mono" font-size="10" font-weight="600">MICROSERVICES</text>
    
    <text x="16" y="52" fill="#FAF6EE" class="font-serif" font-size="16" font-weight="600">API Gateway</text>
    <text x="16" y="72" fill="#ABA297" class="font-sans" font-size="12">FastAPI • Express</text>
    <text x="16" y="90" fill="#8C8176" class="font-mono" font-size="10.5">JWT • Rate Limit</text>
    <text x="16" y="106" fill="#756D64" class="font-mono" font-size="10">Docker • Linux</text>
    
    <rect x="16" y="120" width="70" height="14" rx="4" fill="#251E1A" stroke="#5E3827" stroke-width="1" />
    <text x="22" y="131" fill="#E89275" class="font-mono" font-size="9">&lt; 18ms LATENCY</text>
  </g>

  <!-- NODE 3: GenAI Orchestrator (HERO NODE) -->
  <g transform="translate(550, 95)">
    <rect x="0" y="0" width="140" height="170" rx="14" fill="url(#highlightNodeBg)" stroke="#D97757" stroke-width="1.8" />
    <circle cx="16" cy="18" r="4" fill="#4ADE80" />
    <text x="26" y="22" fill="#E89275" class="font-mono" font-size="10" font-weight="700">INTELLIGENCE</text>
    
    <text x="16" y="52" fill="#FAF6EE" class="font-serif" font-size="17" font-weight="600">LLM Core</text>
    <text x="16" y="72" fill="#FAF6EE" class="font-sans" font-size="12" font-weight="500">Autonomous Agents</text>
    <text x="16" y="90" fill="#D97757" class="font-mono" font-size="10.5">RAG Pipelines</text>
    
    <line x1="16" y1="102" x2="124" y2="102" stroke="#4A342B" stroke-width="1" />
    <text x="16" y="120" fill="#ABA297" class="font-sans" font-size="11">Context Engine</text>
    <text x="16" y="136" fill="#8C8176" class="font-mono" font-size="10">Prompt Eval</text>
    <text x="16" y="152" fill="#756D64" class="font-mono" font-size="10">Chunking &amp; Token</text>
  </g>

  <!-- NODE 4A: Cache & Message Broker -->
  <g transform="translate(775, 80)">
    <rect x="0" y="0" width="90" height="90" rx="10" fill="url(#nodeBg)" stroke="#3A332B" stroke-width="1.5" />
    <text x="10" y="20" fill="#E5A96A" class="font-mono" font-size="9.5" font-weight="600">CACHE</text>
    <text x="10" y="44" fill="#FAF6EE" class="font-serif" font-size="13" font-weight="600">Redis</text>
    <text x="10" y="60" fill="#ABA297" class="font-sans" font-size="10.5">In-Memory</text>
    <text x="10" y="74" fill="#756D64" class="font-mono" font-size="9">&lt; 2ms</text>
  </g>

  <!-- NODE 4B: Vector DB & Persistence -->
  <g transform="translate(775, 190)">
    <rect x="0" y="0" width="90" height="110" rx="10" fill="url(#nodeBg)" stroke="#3A332B" stroke-width="1.5" />
    <text x="10" y="20" fill="#D97757" class="font-mono" font-size="9.5" font-weight="600">DATABASE</text>
    <text x="10" y="44" fill="#FAF6EE" class="font-serif" font-size="13" font-weight="600">Postgres</text>
    <text x="10" y="60" fill="#ABA297" class="font-sans" font-size="10.5">&amp; MongoDB</text>
    <text x="10" y="78" fill="#E89275" class="font-mono" font-size="9.5">pgvector</text>
    <text x="10" y="94" fill="#756D64" class="font-mono" font-size="9">Acid Compliant</text>
  </g>

  <!-- Bottom Legend / Specs -->
  <g transform="translate(36, 315)">
    <text x="0" y="16" fill="#8C8176" class="font-mono" font-size="11">
      <tspan fill="#D97757">⚡ KEY SPECIFICATIONS:</tspan> Asynchronous I/O • Hybrid Search (Dense + BM25) • Stateless Microservices • Zero Cold-Start Architecture
    </text>
  </g>
</svg>
